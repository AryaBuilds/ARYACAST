<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AryaCast — Weather</title>

  <!-- these are just fonts, loading from google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ===== COLORS AND FONTS - change here if you want different look ===== */
    :root {
      --base-color: #eef0e6;     /* main background, soft green-white */
      --shadow-dark: #c6c9b9;    /* dark shadow side (for 3d effect) */
      --shadow-light: #ffffff;  /* light shadow side (for 3d effect) */
      --text-color: #3d4a3a;     /* normal text color */
      --dim-text: #8a9382;       /* light grey text, for small labels */
      --sun-color: #e0984a;      /* orange, used for sun/heat things */
      --sky-color: #5a8f8a;      /* teal, used for bars/graphs */
      --rain-color: #6b7fb0;     /* blue, used for needle/rain */

      --font-heading: "Poppins", sans-serif;
      --font-body: "Inter", sans-serif;
      --font-numbers: "JetBrains Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--base-color);
      color: var(--text-color);
      font-family: var(--font-body);
    }

    /* ===== NEOMORPHISM STYLE =====
       "raised" = box looks like it is popping out
       "pressed" = box looks like it is pushed in
       both use same background color, only shadow direction changes */
    .raised {
      background: var(--base-color);
      border-radius: 20px;
      box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
    }

    .pressed {
      background: var(--base-color);
      border-radius: 16px;
      box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
    }

    .mono-font {
      font-family: var(--font-numbers);
    }

    /* ===== TOP BAR (logo + search box) ===== */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px 30px;
    }

    .logo-circle {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--sun-color);
      font-size: 1.2rem;
    }

    .logo-text {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.14em;
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 400px;
      display: flex;
    }

    .search-inner {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 4px 4px 4px 16px;
      border-radius: 999px;
    }

    .search-inner input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 0.94rem;
      padding: 9px 6px;
      outline: none;
    }

    .search-inner input::placeholder {
      color: var(--dim-text);
    }

    .search-inner button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--base-color);
      color: var(--sun-color);
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
    }

    .search-inner button:active {
      box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
    }

    .coords-text {
      color: var(--dim-text);
      font-size: 0.76rem;
    }

    /* ===== MAIN APP AREA ===== */
    .app-area {
      max-width: 1040px;
      margin: 0 auto;
      padding: 20px;
    }

    /* loading spinner and error message */
    .status-box {
      text-align: center;
      padding: 70px 20px;
      color: var(--dim-text);
    }

    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 14px;
      border-radius: 50%;
      box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
      position: relative;
    }

    .spinner::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--sun-color);
      animation: spin-turn 0.9s linear infinite;
    }

    @keyframes spin-turn {
      to { transform: rotate(360deg); }
    }

    /* ===== HERO SECTION (big temperature + compass) ===== */
    .hero-box {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 26px;
      align-items: center;
      padding: 32px 30px;
      margin-bottom: 18px;
    }

    @media (max-width: 700px) {
      .hero-box {
        grid-template-columns: 1fr;
      }
    }

    .place-name {
      color: var(--dim-text);
      font-size: 0.8rem;
      text-transform: uppercase;
      margin: 0 0 6px;
    }

    .temp-row {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      line-height: 1;
    }

    .temp-number {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 5.5rem;
    }

    .temp-unit {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      margin-top: 8px;
      color: var(--dim-text);
    }

    .condition-text {
      font-size: 1.05rem;
      margin: 6px 0 4px;
    }

    .feels-like {
      color: var(--dim-text);
      font-size: 0.8rem;
      margin: 0;
    }

    /* wind compass circle */
    .compass-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .compass-circle {
      width: 190px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
    }

    .compass-svg {
      width: 88%;
    }

    .tick-lines line {
      stroke: var(--shadow-dark);
      stroke-width: 1.5;
    }

    .tick-lines line.big-tick {
      stroke: var(--dim-text);
      stroke-width: 2;
    }

    .direction-label {
      fill: var(--dim-text);
      font-family: var(--font-numbers);
      font-size: 11px;
    }

    .wind-needle {
      transition: transform 1.1s ease;
    }

    .needle-arrow {
      fill: var(--rain-color);
    }

    .needle-center {
      fill: var(--base-color);
      stroke: var(--shadow-dark);
    }

    .wind-reading-text {
      fill: var(--text-color);
      font-size: 12px;
      font-family: var(--font-numbers);
    }

    .wind-caption {
      color: var(--dim-text);
      font-size: 0.74rem;
      margin: 0;
    }

    /* ===== SMALL GAUGE CARDS (humidity, pressure, etc) ===== */
    .gauge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .gauge-card {
      padding: 14px 16px;
    }

    .gauge-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      color: var(--dim-text);
      margin: 0 0 6px;
    }

    .gauge-value {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0;
    }

    .gauge-value small {
      font-family: var(--font-body);
      font-size: 0.8rem;
      color: var(--dim-text);
      font-weight: 400;
    }

    .gauge-bar-bg {
      height: 9px;
      border-radius: 6px;
      margin-top: 8px;
      box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
    }

    .gauge-bar-fill {
      height: 100%;
      background: var(--sky-color);
      border-radius: 6px;
      transition: width 1s ease;
    }

    /* ===== HOURLY AND DAILY PANELS ===== */
    .panel-box {
      padding: 18px 24px;
      margin-bottom: 18px;
    }

    .panel-heading {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--dim-text);
      margin: 0 0 14px;
    }

    .hourly-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 4px 8px;
    }

    .hour-card {
      flex: 0 0 auto;
      width: 74px;
      text-align: center;
      padding: 12px 4px;
      border-radius: 14px;
    }

    .hour-card p {
      margin: 0 0 6px;
    }

    .hour-time {
      font-size: 0.7rem;
      color: var(--dim-text);
    }

    .hour-icon {
      font-size: 1.2rem;
    }

    .hour-temp {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 0;
    }

    .daily-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .day-row {
      display: grid;
      grid-template-columns: 66px 26px 1fr 92px;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
    }

    .day-name {
      font-size: 0.85rem;
    }

    .day-temp-range {
      display: flex;
      gap: 6px;
      justify-self: end;
      font-family: var(--font-numbers);
      font-size: 0.8rem;
    }

    .day-low {
      color: var(--dim-text);
    }

    .day-track {
      width: 64px;
      height: 6px;
      border-radius: 4px;
      position: relative;
      box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
    }

    .day-track-fill {
      position: absolute;
      top: 0;
      height: 100%;
      border-radius: 4px;
      background: var(--sun-color);
    }

    .footer-text {
      text-align: center;
      color: var(--dim-text);
      font-size: 0.72rem;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="logo-circle raised">✥</div>
    <span class="logo-text">ARYACAST</span>

    <form class="search-box" id="searchForm" autocomplete="off">
      <div class="search-inner pressed">
        <input type="text" id="cityInput" placeholder="Search a place...">
        <button type="submit">→</button>
      </div>
    </form>

    <div class="coords-text mono-font" id="coordsText">— · —</div>
  </header>

  <main class="app-area">

    <!-- shown while data is loading -->
    <section class="status-box" id="loadingBox">
      <div class="spinner"></div>
      <p>Reading the instruments...</p>
    </section>

    <!-- shown if something goes wrong -->
    <section class="status-box" id="errorBox" hidden>
      <p style="color: var(--rain-color); font-family: var(--font-heading); font-size: 1.4rem; margin: 0;">No signal.</p>
      <p id="errorMessage">Try another place.</p>
    </section>

    <!-- main dashboard, hidden until data is ready -->
    <section id="dashboardBox" hidden>

      <!-- big temperature + wind compass -->
      <section class="hero-box raised">
        <div>
          <p class="place-name mono-font" id="placeText">—</p>
          <div class="temp-row">
            <span class="temp-number" id="tempNumber">--</span>
            <span class="temp-unit">°C</span>
          </div>
          <p class="condition-text" id="conditionText">—</p>
          <p class="feels-like mono-font">feels like <span id="feelsLikeText">--°</span></p>
        </div>

        <div class="compass-column">
          <div class="compass-circle">
            <svg viewBox="0 0 220 220" class="compass-svg">
              <g class="tick-lines" id="tickLinesGroup"></g>

              <text class="direction-label" x="110" y="24" text-anchor="middle">N</text>
              <text class="direction-label" x="110" y="203" text-anchor="middle">S</text>
              <text class="direction-label" x="16" y="115" text-anchor="middle">W</text>
              <text class="direction-label" x="204" y="115" text-anchor="middle">E</text>

              <g id="needleGroup" class="wind-needle">
                <polygon points="110,34 116,110 110,124 104,110" class="needle-arrow"></polygon>
                <circle cx="110" cy="110" r="7" class="needle-center"></circle>
              </g>

              <text class="wind-reading-text" x="110" y="150" text-anchor="middle" id="windSpeedText">-- km/h</text>
            </svg>
          </div>
          <p class="wind-caption mono-font">WIND · <span id="windDirText">--</span></p>
        </div>
      </section>

      <!-- small gauge cards: humidity, pressure, rain, uv -->
      <section class="gauge-grid" id="gaugeGrid"></section>

      <!-- next 24 hour list -->
      <section class="panel-box raised">
        <h2 class="panel-heading">Next 24 hours</h2>
        <div class="hourly-row" id="hourlyRow"></div>
      </section>

      <!-- 7 day list -->
      <section class="panel-box raised">
        <h2 class="panel-heading">7-day outlook</h2>
        <div class="daily-list" id="dailyList"></div>
      </section>

      <p class="footer-text mono-font">Data via Open-Meteo · updated <span id="updatedTimeText">—</span></p>

    </section>

  </main>

  <script>
    // ============================================================
    // AryaCast — weather dashboard
    // Data comes from Open-Meteo (it is free, no api key needed)
    // ============================================================

    // these two links are the api addresses we call
    const GEOCODE_API_URL = "https://geocoding-api.open-meteo.com/v1/search";
    const WEATHER_API_URL = "https://api.open-meteo.com/v1/forecast";

    // small helper: same as document.getElementById but shorter to type
    function getEl(id) {
      return document.getElementById(id);
    }

    // this is a lookup table for weather codes
    // open-meteo gives a number code, this turns it into text + emoji
    const WEATHER_CODES = {
      0: ["Clear sky", "☀"],
      1: ["Mainly clear", "🌤"],
      2: ["Partly cloudy", "⛅"],
      3: ["Overcast", "☁"],
      45: ["Fog", "🌫"],
      48: ["Rime fog", "🌫"],
      51: ["Light drizzle", "🌦"],
      53: ["Drizzle", "🌦"],
      55: ["Dense drizzle", "🌦"],
      61: ["Light rain", "🌧"],
      63: ["Rain", "🌧"],
      65: ["Heavy rain", "🌧"],
      71: ["Light snow", "🌨"],
      73: ["Snow", "🌨"],
      75: ["Heavy snow", "❄"],
      80: ["Showers", "🌦"],
      81: ["Showers", "🌦"],
      82: ["Violent showers", "⛈"],
      95: ["Thunderstorm", "⛈"],
      96: ["Thunderstorm + hail", "⛈"]
    };

    function getWeatherLabel(code) {
      const found = WEATHER_CODES[code];
      return found ? found[0] : "Unknown";
    }

    function getWeatherIcon(code) {
      const found = WEATHER_CODES[code];
      return found ? found[1] : "•";
    }

    // this draws the small tick marks around the compass circle
    function drawCompassTicks() {
      const centerX = 110;
      const centerY = 110;
      const outerRadius = 96;
      const group = getEl("tickLinesGroup");

      // go around the circle, one tick every 10 degrees
      for (let degree = 0; degree < 360; degree += 10) {
        const isBigTick = degree % 90 === 0;
        const innerRadius = isBigTick ? 82 : 88;

        // convert degree to radians, and shift by -90 so 0 points up (north)
        const angle = (degree - 90) * (Math.PI / 180);

        const x1 = centerX + outerRadius * Math.cos(angle);
        const y1 = centerY + outerRadius * Math.sin(angle);
        const x2 = centerX + innerRadius * Math.cos(angle);
        const y2 = centerY + innerRadius * Math.sin(angle);

        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x1.toFixed(1));
        line.setAttribute("y1", y1.toFixed(1));
        line.setAttribute("x2", x2.toFixed(1));
        line.setAttribute("y2", y2.toFixed(1));

        if (isBigTick) {
          line.classList.add("big-tick");
        }

        group.appendChild(line);
      }
    }

    // turns a wind angle number (like 90) into a letter (like "E")
    function angleToCompassLetter(degree) {
      const letters = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
      const index = Math.round(degree / 45) % 8;
      return letters[index];
    }

    // keeps a number between a min and max value
    function clampNumber(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    // this asks open-meteo: "where is this place name?"
    // it gives back latitude and longitude for that place
    async function findPlace(placeName, howMany) {
      const url = GEOCODE_API_URL + "?name=" + encodeURIComponent(placeName)
        + "&count=" + howMany + "&language=en&format=json";

      const response = await fetch(url);
      const data = await response.json();

      // if nothing found, results will be missing, so return empty list
      return data.results || [];
    }

    // builds a nice label like "Patna, Bihar" from the place data
    function buildPlaceLabel(place) {
      const parts = [place.name, place.admin1, place.country];
      const nonEmptyParts = parts.filter(function (part) { return part; });
      return nonEmptyParts.slice(0, 2).join(", ");
    }

    // called when user types a place name and hits search
    async function searchAndShowWeather(placeName) {
      showOnly("loadingBox");

      try {
        const results = await findPlace(placeName, 1);

        if (results.length === 0) {
          getEl("errorMessage").textContent = "Couldn't find \"" + placeName + "\".";
          showOnly("errorBox");
          return;
        }

        const place = results[0];
        loadWeatherFor(place.latitude, place.longitude, buildPlaceLabel(place));

      } catch (err) {
        getEl("errorMessage").textContent = "Network error, try again.";
        showOnly("errorBox");
      }
    }

    // main function: gets the actual weather data for given lat/lon
    async function loadWeatherFor(latitude, longitude, placeLabel) {
      showOnly("loadingBox");

      try {
        // this list tells the api exactly which numbers we want back
        const params = new URLSearchParams({
          latitude: latitude,
          longitude: longitude,
          current: "temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure",
          hourly: "temperature_2m,weather_code",
          daily: "weather_code,temperature_2m_max,temperature_2m_min,uv_index_max",
          timezone: "auto",
          forecast_days: 7
        });

        const response = await fetch(WEATHER_API_URL + "?" + params);
        const weatherData = await response.json();

        displayWeather(weatherData, placeLabel, latitude, longitude);

      } catch (err) {
        getEl("errorMessage").textContent = "Instruments went quiet, try again.";
        showOnly("errorBox");
      }
    }

    // shows only one box at a time (loading / error / dashboard)
    function showOnly(boxIdToShow) {
      const allBoxIds = ["loadingBox", "errorBox", "dashboardBox"];
      allBoxIds.forEach(function (id) {
        getEl(id).hidden = (id !== boxIdToShow);
      });
    }

    // this fills the whole page with the weather numbers we got
    function displayWeather(weatherData, placeLabel, latitude, longitude) {
      const current = weatherData.current;

      // ---- top part: coords, place name, big temperature ----
      getEl("coordsText").textContent = latitude.toFixed(2) + "° " + longitude.toFixed(2) + "°";
      getEl("placeText").textContent = placeLabel;
      getEl("tempNumber").textContent = Math.round(current.temperature_2m);
      getEl("conditionText").textContent = getWeatherIcon(current.weather_code) + " " + getWeatherLabel(current.weather_code);
      getEl("feelsLikeText").textContent = Math.round(current.apparent_temperature) + "°";

      // ---- wind compass needle rotation ----
      const windAngle = current.wind_direction_10m;
      getEl("needleGroup").setAttribute("transform", "rotate(" + windAngle + " 110 110)");
      getEl("windSpeedText").textContent = Math.round(current.wind_speed_10m) + " km/h";
      getEl("windDirText").textContent = Math.round(windAngle) + "° " + angleToCompassLetter(windAngle);

      // ---- gauge cards: humidity, pressure, rain, uv ----
      fillGaugeCards(current, weatherData.daily);

      // ---- hourly strip ----
      fillHourlyRow(weatherData.hourly);

      // ---- 7 day list ----
      fillDailyList(weatherData.daily);

      getEl("updatedTimeText").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      showOnly("dashboardBox");
    }

    function fillGaugeCards(current, daily) {
      const uvIndex = daily.uv_index_max ? daily.uv_index_max[0] : null;

      // each row here is: [label shown, value shown, percent for the bar]
      const gaugeList = [
        ["Humidity", Math.round(current.relative_humidity_2m) + "<small>%</small>", current.relative_humidity_2m],
        ["Pressure", Math.round(current.surface_pressure) + "<small>hPa</small>", clampNumber((current.surface_pressure - 970) / 0.8, 4, 100)],
        ["Precipitation", current.precipitation.toFixed(1) + "<small>mm</small>", clampNumber(current.precipitation * 20, 4, 100)],
        ["UV index", uvIndex !== null ? uvIndex.toFixed(1) : "—", uvIndex !== null ? clampNumber((uvIndex / 11) * 100, 4, 100) : 0]
      ];

      const gaugeGrid = getEl("gaugeGrid");
      gaugeGrid.innerHTML = "";

      gaugeList.forEach(function (gauge) {
        const label = gauge[0];
        const value = gauge[1];
        const percent = gauge[2];

        const cardHtml =
          '<div class="gauge-card raised">' +
            '<p class="gauge-label">' + label + '</p>' +
            '<p class="gauge-value">' + value + '</p>' +
            '<div class="gauge-bar-bg"><div class="gauge-bar-fill" style="width:' + percent + '%"></div></div>' +
          '</div>';

        gaugeGrid.innerHTML += cardHtml;
      });
    }

    function fillHourlyRow(hourly) {
      const hourlyRow = getEl("hourlyRow");
      hourlyRow.innerHTML = "";

      // find the index of the first hour that is now or later
      const now = new Date();
      let startIndex = hourly.time.findIndex(function (t) { return new Date(t) >= now; });
      if (startIndex === -1) {
        startIndex = 0;
      }

      // only show the next 24 hours starting from now
      const next24Hours = hourly.time.slice(startIndex, startIndex + 24);

      next24Hours.forEach(function (timeString, i) {
        const realIndex = startIndex + i;
        const hourLabel = new Date(timeString).toLocaleTimeString([], { hour: "numeric" });
        const weatherCode = hourly.weather_code[realIndex];
        const temp = Math.round(hourly.temperature_2m[realIndex]);

        const cardHtml =
          '<div class="hour-card raised">' +
            '<p class="hour-time">' + hourLabel + '</p>' +
            '<p class="hour-icon">' + getWeatherIcon(weatherCode) + '</p>' +
            '<p class="hour-temp">' + temp + '°</p>' +
          '</div>';

        hourlyRow.innerHTML += cardHtml;
      });
    }

    function fillDailyList(daily) {
      const dailyList = getEl("dailyList");
      dailyList.innerHTML = "";

      const allLows = daily.temperature_2m_min;
      const allHighs = daily.temperature_2m_max;

      // find the coldest and hottest point across the whole week
      // this is used to draw the little bar showing where today sits
      const weekMin = Math.min.apply(null, allLows);
      const weekMax = Math.max.apply(null, allHighs);
      const weekSpan = (weekMax - weekMin) || 1;

      daily.time.forEach(function (dateString, i) {
        const dayLabel = (i === 0) ? "Today" : new Date(dateString).toLocaleDateString([], { weekday: "short" });
        const low = Math.round(allLows[i]);
        const high = Math.round(allHighs[i]);

        const barLeftPercent = ((low - weekMin) / weekSpan) * 100;
        const barWidthPercent = Math.max(((high - low) / weekSpan) * 100, 6);

        const rowHtml =
          '<div class="day-row pressed">' +
            '<span class="day-name">' + dayLabel + '</span>' +
            '<span>' + getWeatherIcon(daily.weather_code[i]) + '</span>' +
            '<div class="day-track">' +
              '<div class="day-track-fill" style="left:' + barLeftPercent + '%; width:' + barWidthPercent + '%"></div>' +
            '</div>' +
            '<span class="day-temp-range"><span class="day-low">' + low + '°</span> / ' + high + '°</span>' +
          '</div>';

        dailyList.innerHTML += rowHtml;
      });
    }

    // ============================================================
    // this part runs first, when the page opens
    // ============================================================

    // draw the compass ticks once, right away
    drawCompassTicks();

    // when user submits the search form, search for that place
    getEl("searchForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const typedPlace = getEl("cityInput").value.trim();
      if (typedPlace) {
        searchAndShowWeather(typedPlace);
      }
    });

    // on first load, try to use the browser's location
    // if that fails or is blocked, just show Patna as default
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function (position) {
          loadWeatherFor(position.coords.latitude, position.coords.longitude, "Your location");
        },
        function () {
          loadWeatherFor(25.5941, 85.1376, "Patna, India");
        },
        { timeout: 4000 }
      );
    } else {
      loadWeatherFor(25.5941, 85.1376, "Patna, India");
    }
  </script>

</body>
</html>
